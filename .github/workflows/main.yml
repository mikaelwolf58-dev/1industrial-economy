name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Выдача прав на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка JAR-файла мода
        run: ./gradlew build

      - name: Сохранение готового мода
        uses: actions/upload-artifact@v4
        with:
          name: industrial_economy_mod
          path: build/libs/*.jar
